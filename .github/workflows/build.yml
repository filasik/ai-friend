name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build   # compiles with -Werror and runs the unit tests
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AI Friend
          path: build/libs/*.jar
