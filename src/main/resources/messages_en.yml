# AI Friend messages (MiniMessage). Missing keys fall back to the built-in English text.
# Placeholders in <angle brackets> are filled in by the plugin; keep them.
prefix: '<dark_gray>[<gold>AI Friend<dark_gray>]<reset>'

error:
  not-ready: '<prefix> <red>AI Friend is still starting up. Try again in a moment.'
  players-only: '<prefix> <red>This command can only be used by players.'
  no-permission: '<prefix> <red>You do not have permission to do that.'
  generic: '<prefix> <red>Something went wrong. Please try again or tell an admin.'

# How the bot's answer looks in chat. <bot> is chatbot-name from config.yml, <text> the answer (never parsed as MiniMessage).
chat:
  format: '<gray><bot><dark_gray>:</dark_gray> <white><text>'

command:
  info: '<prefix> <gray>AI Friend v<version> · <white>/aifriend status</white> shows the state, <white>/aifriend reload</white> reloads the configuration.'
  reloaded: '<prefix> <green>Configuration and messages reloaded. Command aliases need a restart.'
  status:
    - '<prefix> <gold>AI Friend v<version>'
    - '<gray>  State: <white><state>'
    - '<gray>  Bot: <white><bot></white> · model <white><model></white> · language <white><language>'
    - '<gray>  API key: <white><key>'
    - '<gray>  Interval: <white><interval> s</white> · queued chat lines: <white><queued>/<max-queued>'
    - '<gray>  Failed requests in a row: <white><failures>'
  state:
    running: '<green>running'
    disabled: '<red>disabled (enabled: false in config.yml)'
    no-key: '<red>idle, api-key is not set in config.yml'
    sleeping: '<yellow>sleeping, wakes up in <minutes> min (players were not interested)'
    backoff: '<yellow>waiting <seconds> s before the next attempt (last request failed)'

  mute:
    done: '<prefix> <gray>You will not be heard by the bot any more. Undo it with <white>/aifriend unmute</white>.'
    already: '<prefix> <yellow>You have already muted the bot.'
    disabled: '<prefix> <red>Muting is switched off on this server.'
  unmute:
    done: '<prefix> <green>The bot can hear you again.'
    already: '<prefix> <yellow>You have not muted the bot.'
  ask:
    usage: '<prefix> <gray>Usage: <white>/ai <question>'
    muted: '<prefix> <yellow>You have muted the bot. Use <white>/aifriend unmute</white> first.'
    disabled: '<prefix> <red>Asking the bot directly is switched off on this server.'
    thinking: '<prefix> <gray>Thinking...'
    failed: '<prefix> <red>The bot could not answer right now. Please try again later.'
    empty: '<prefix> <yellow>The bot has nothing to say about that.'
  limit:
    cooldown: '<prefix> <yellow>Please wait <seconds> s before asking again.'
    player-calls: '<prefix> <yellow>You have used all your questions for today. They reset in <hours> h <minutes> min.'
    player-tokens: '<prefix> <yellow>Your daily allowance is used up. It resets in <hours> h <minutes> min.'
    global-calls: '<prefix> <yellow>The bot has reached its limit for today. It resets in <hours> h <minutes> min.'
    global-tokens: '<prefix> <yellow>The bot has reached its limit for today. It resets in <hours> h <minutes> min.'
    remaining: '<prefix> <gray>Your questions left today: <white><calls></white> · tokens: <white><tokens></white> · cooldown: <white><cooldown> s'
    unlimited: 'unlimited'
  sleep:
    done: '<prefix> <gray>The bot is quiet for <white><minutes> min</white>. <white>/aifriend wake</white> wakes it up.'
    invalid: '<prefix> <red>Minutes must be a number between 1 and 1440.'
  wake:
    done: '<prefix> <green>The bot is awake again.'
    already: '<prefix> <yellow>The bot was not sleeping.'
  status-extra:
    - '<gray>  Provider: <white><provider>'
    - '<gray>  Muted players: <white><muted>'
    - '<gray>  Personas: <white><persona>'
    - '<gray>  Memory: <white><turns> turns'
    - '<gray>  Long-term memory: <white><longmemory>'
  status-awareness:
    - '<gray>  Server context: <white><context></white> · mood: <white><mood>'
    - '<gray>  Relationships: <white><relationships></white> · boredom: <white><boredom></white> · supervision: <white><supervision>'
  awareness:
    enabled: 'on'
    disabled: 'off'
  nickname:
    disabled: '<prefix> <yellow>Nicknames are switched off on this server.'
    muted: '<prefix> <yellow>You have muted the bot. Use <white>/aifriend unmute</white> first.'
    invalid: '<prefix> <red>That nickname has no usable characters (letters, digits, space and _ - . '' only).'
    rejected: '<prefix> <red>The bot cannot use that nickname.'
    set: '<prefix> <green>The bot may call you <white><nickname></white> now.'
    cleared: '<prefix> <gray>Your nickname is cleared.'
    info: '<prefix> <gray>The bot knows you as: <white><level></white> · for <white><days></white> day(s) · nickname: <white><nickname></white>. Change it with <white>/aifriend nickname <text></white> or <white>/aifriend nickname clear</white>.'
    level:
      stranger: 'a stranger'
      acquaintance: 'an acquaintance'
      regular: 'a regular'
      friend: 'a friend'
  cost:
    header: '<prefix> <gold>Token usage and estimated cost'
    lines:
      - '<gray>  Today: <white><today-in> in</white> / <white><today-out> out</white> tokens · <white><today-cost></white>'
      - '<gray>  Total since start: <white><total-in> in</white> / <white><total-out> out</white> tokens · <white><total-cost></white>'
      - '<gray>  Daily warning at: <white><warn>'
    disabled: '<prefix> <yellow>Cost tracking is switched off (cost.enabled in config.yml).'
    warning: '<prefix> <red>The estimated cost of today reached <white><cost></white> (warning at <white><warn></white>).'
  simulate:
    header: '<prefix> <gold>Dry run, nothing was posted to chat'
    lines:
      - '<gray>  Persona: <white><persona>'
      - '<gray>  Chat lines: <white><queued></white> · memory turns: <white><history></white> · about <white><tokens></white> input tokens'
      - '<gray>  Would be sent: <white><send>'
      - '<gray>  Blocked by: <white><blockers>'
      - '<gray>  Raw answer: <white><raw>'
      - '<gray>  After filter: <white><filtered>'
    request: '<gray>  Request: <white><request>'
    answer-yes: 'yes'
    answer-no: 'no'
    none: '-'
    blocker:
      DISABLED: 'bot disabled'
      NO_KEY: 'no api-key'
      SLEEPING: 'sleeping'
      BACKOFF: 'waiting after an error'
      RATE_LIMITED: 'rate limit'
      NO_CHAT: 'no chat lines'
      MUTED: 'all authors muted'
      FILTERED_OUT: 'answer removed by the filter'
  events:
    # Shown in /aifriend status when events are on.
    status: '<gray>  Event reactions: <white><types>'
    disabled: 'off'

# Long-term memory (/aifriend forget, forget-all, memory). <note> and <player> are player text, never parsed as MiniMessage.
memory:
  disabled: '<prefix> <yellow>Long-term memory is switched off on this server (long-term-memory.enabled in config.yml).'
  unavailable: '<prefix> <red>Long-term memory is on, but its database is not available. See the console.'
  forgot-own: '<prefix> <green>Done. The bot has forgotten <count> note(s) about you.'
  forgot-player: '<prefix> <green>Deleted <count> note(s) about <player>.'
  forgot-all: '<prefix> <green>Deleted all remembered notes (<count>).'
  player-unknown: '<prefix> <yellow>No notes found for a player called <player>.'
  list-header: '<prefix> <gold>What the bot remembers about <player> (<count>)'
  list-line: '<gray>  - <white><note></white> <dark_gray>(<age>)'
  list-more: '<gray>  ... and <count> more'
  list-empty: '<prefix> <gray>The bot remembers nothing about <player>.'
  failed: '<prefix> <red>The memory database returned an error. See the console.'
  forgot-relationship: '<prefix> <green>Done. The bot has forgotten how well it knows you.'
  forgot-relationship-player: '<prefix> <green>The bot has forgotten <player>.'
  forgot-relationship-all: '<prefix> <green>The bot has forgotten all players it knew (<count>).'

# Friendly private notes of the chat supervision (nothing else happens to the player).
supervision:
  caps: '<prefix> <gray>Psst, your message is quite LOUD. Please ease off the caps lock :)'
  spam: '<prefix> <gray>Easy there, you are writing very fast or repeating yourself. Give the chat a moment to breathe :)'
  language: '<prefix> <gray>Let us keep the chat friendly, please. Everybody here is a human (or a bot) with feelings :)'

update:
  available: '<prefix> <yellow>A new version is available: <white><version></white> <click:open_url:''<url>''><aqua>[download]</aqua></click>'
