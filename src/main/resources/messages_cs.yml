# Zprávy AI Friend (MiniMessage). Chybějící klíče se doplní z vestavěné angličtiny.
# Zástupné znaky v <ostrých závorkách> plugin vyplní sám, nech je.
prefix: '<dark_gray>[<gold>AI Friend<dark_gray>]<reset>'

error:
  not-ready: '<prefix> <red>AI Friend se ještě spouští. Zkus to za chvíli.'
  players-only: '<prefix> <red>Tento příkaz mohou použít jen hráči.'
  no-permission: '<prefix> <red>Na tohle nemáš oprávnění.'
  generic: '<prefix> <red>Něco se pokazilo. Zkus to znovu nebo napiš adminovi.'

# Jak vypadá odpověď bota v chatu. <bot> je chatbot-name z config.yml, <text> odpověď (nikdy se nečte jako MiniMessage).
chat:
  format: '<gray><bot><dark_gray>:</dark_gray> <white><text>'

command:
  info: '<prefix> <gray>AI Friend v<version> · <white>/aifriend status</white> ukáže stav, <white>/aifriend reload</white> načte konfiguraci znovu.'
  reloaded: '<prefix> <green>Konfigurace a zprávy znovu načteny. Aliasy příkazů vyžadují restart.'
  status:
    - '<prefix> <gold>AI Friend v<version>'
    - '<gray>  Stav: <white><state>'
    - '<gray>  Bot: <white><bot></white> · model <white><model></white> · jazyk <white><language>'
    - '<gray>  API klíč: <white><key>'
    - '<gray>  Interval: <white><interval> s</white> · řádků chatu ve frontě: <white><queued>/<max-queued>'
    - '<gray>  Neúspěšných požadavků za sebou: <white><failures>'
  state:
    running: '<green>běží'
    disabled: '<red>vypnutý (enabled: false v config.yml)'
    no-key: '<red>nečinný, žádný api-key poskytovatele v config.yml'
    sleeping: '<yellow>spí, probudí se za <minutes> min (hráči neměli zájem)'
    backoff: '<yellow>čeká <seconds> s před dalším pokusem (poslední požadavek selhal)'

  mute:
    done: '<prefix> <gray>Bot vás už neslyší. Zrušíte to příkazem <white>/aifriend unmute</white>.'
    already: '<prefix> <yellow>Bota už máte ztlumeného.'
    disabled: '<prefix> <red>Ztlumení je na tomto serveru vypnuté.'
  unmute:
    done: '<prefix> <green>Bot vás zase slyší.'
    already: '<prefix> <yellow>Bota nemáte ztlumeného.'
  ask:
    usage: '<prefix> <gray>Použití: <white>/ai <dotaz>'
    muted: '<prefix> <yellow>Máte ztlumeného bota. Nejdřív použijte <white>/aifriend unmute</white>.'
    disabled: '<prefix> <red>Přímé dotazy na bota jsou na tomto serveru vypnuté.'
    thinking: '<prefix> <gray>Přemýšlím...'
    failed: '<prefix> <red>Bot teď nemůže odpovědět. Zkuste to prosím později.'
    empty: '<prefix> <yellow>Bot k tomu nemá co říct.'
  limit:
    cooldown: '<prefix> <yellow>Počkejte prosím <seconds> s, než se zeptáte znovu.'
    player-calls: '<prefix> <yellow>Dnešní dotazy jste vyčerpali. Obnoví se za <hours> h <minutes> min.'
    player-tokens: '<prefix> <yellow>Váš denní limit je vyčerpaný. Obnoví se za <hours> h <minutes> min.'
    global-calls: '<prefix> <yellow>Bot dnes dosáhl svého limitu. Obnoví se za <hours> h <minutes> min.'
    global-tokens: '<prefix> <yellow>Bot dnes dosáhl svého limitu. Obnoví se za <hours> h <minutes> min.'
    remaining: '<prefix> <gray>Zbývající dotazy dnes: <white><calls></white> · tokeny: <white><tokens></white> · čekání: <white><cooldown> s'
    unlimited: 'neomezeno'
  sleep:
    done: '<prefix> <gray>Bot mlčí <white><minutes> min</white>. <white>/aifriend wake</white> ho probudí.'
    invalid: '<prefix> <red>Minuty musí být číslo od 1 do 1440.'
  wake:
    done: '<prefix> <green>Bot je zase vzhůru.'
    already: '<prefix> <yellow>Bot nespal.'
  status-extra:
    - '<gray>  Poskytovatel: <white><provider>'
    - '<gray>  Hráči s ztlumeným botem: <white><muted>'
    - '<gray>  Persony: <white><persona>'
    - '<gray>  Paměť: <white><turns> výměn'
    - '<gray>  Dlouhodobá paměť: <white><longmemory>'
  status-awareness:
    - '<gray>  Kontext serveru: <white><context></white> · nálada: <white><mood>'
    - '<gray>  Vztahy: <white><relationships></white> · nuda: <white><boredom></white> · dohled: <white><supervision>'
  awareness:
    enabled: 'zapnuto'
    disabled: 'vypnuto'
  nickname:
    disabled: '<prefix> <yellow>Přezdívky jsou na tomto serveru vypnuté.'
    muted: '<prefix> <yellow>Máš bota ztlumeného. Nejdřív použij <white>/aifriend unmute</white>.'
    invalid: '<prefix> <red>Tahle přezdívka neobsahuje použitelné znaky (písmena, číslice, mezera a _ - . '' ).'
    rejected: '<prefix> <red>Bot tuhle přezdívku použít nemůže.'
    set: '<prefix> <green>Bot ti teď může říkat <white><nickname></white>.'
    cleared: '<prefix> <gray>Tvoje přezdívka je smazaná.'
    info: '<prefix> <gray>Bot tě zná jako: <white><level></white> · už <white><days></white> dní · přezdívka: <white><nickname></white>. Změníš ji příkazem <white>/aifriend nickname <text></white> nebo <white>/aifriend nickname clear</white>.'
    level:
      stranger: 'cizince'
      acquaintance: 'známého'
      regular: 'štamgasta'
      friend: 'kamaráda'
  cost:
    header: '<prefix> <gold>Spotřeba tokenů a odhad ceny'
    lines:
      - '<gray>  Dnes: <white><today-in> vstup</white> / <white><today-out> výstup</white> tokenů · <white><today-cost></white>'
      - '<gray>  Celkem od startu: <white><total-in> vstup</white> / <white><total-out> výstup</white> tokenů · <white><total-cost></white>'
      - '<gray>  Denní upozornění při: <white><warn>'
    disabled: '<prefix> <yellow>Sledování nákladů je vypnuté (cost.enabled v config.yml).'
    warning: '<prefix> <red>Odhadovaná cena dneška dosáhla <white><cost></white> (upozornění při <white><warn></white>).'
  simulate:
    header: '<prefix> <gold>Zkušební běh, nic se neposlalo do chatu'
    lines:
      - '<gray>  Persona: <white><persona>'
      - '<gray>  Řádky chatu: <white><queued></white> · repliky paměti: <white><history></white> · asi <white><tokens></white> vstupních tokenů'
      - '<gray>  Bylo by odesláno: <white><send>'
      - '<gray>  Zablokováno: <white><blockers>'
      - '<gray>  Surová odpověď: <white><raw>'
      - '<gray>  Po filtru: <white><filtered>'
    request: '<gray>  Dotaz: <white><request>'
    answer-yes: 'ano'
    answer-no: 'ne'
    none: '-'
    blocker:
      DISABLED: 'bot je vypnutý'
      NO_KEY: 'chybí api-key'
      SLEEPING: 'spí'
      BACKOFF: 'čeká po chybě'
      RATE_LIMITED: 'limit'
      NO_CHAT: 'žádné řádky chatu'
      MUTED: 'všichni autoři jsou ztlumení'
      FILTERED_OUT: 'odpověď odstranil filtr'
  events:
    status: '<gray>  Reakce na události: <white><types>'
    disabled: 'vypnuto'

# Dlouhodobá paměť (/aifriend forget, forget-all, memory). <note> a <player> jsou text hráčů, nikdy se nečtou jako MiniMessage.
memory:
  disabled: '<prefix> <yellow>Dlouhodobá paměť je na tomto serveru vypnutá (long-term-memory.enabled v config.yml).'
  unavailable: '<prefix> <red>Dlouhodobá paměť je zapnutá, ale její databáze není dostupná. Koukni do konzole.'
  forgot-own: '<prefix> <green>Hotovo. Bot zapomněl <count> poznámek o tobě.'
  forgot-player: '<prefix> <green>Smazáno poznámek o hráči <player>: <count>.'
  forgot-all: '<prefix> <green>Všechny zapamatované poznámky smazány (<count>).'
  player-unknown: '<prefix> <yellow>Hráč <player> nemá žádné poznámky.'
  list-header: '<prefix> <gold>Co si bot pamatuje o hráči <player> (<count>)'
  list-line: '<gray>  - <white><note></white> <dark_gray>(<age>)'
  list-more: '<gray>  ... a dalších <count>'
  list-empty: '<prefix> <gray>Bot si o hráči <player> nic nepamatuje.'
  failed: '<prefix> <red>Databáze paměti vrátila chybu. Koukni do konzole.'
  forgot-relationship: '<prefix> <green>Hotovo. Bot zapomněl, jak dobře tě zná.'
  forgot-relationship-player: '<prefix> <green>Bot zapomněl hráče <player>.'
  forgot-relationship-all: '<prefix> <green>Bot zapomněl všechny hráče, které znal (<count>).'

# Znalosti o serveru (/aifriend teach, /aifriend knowledge). <text> je text admina, nikdy se neparsuje jako MiniMessage.
knowledge:
  disabled: '<prefix> <yellow>Znalosti o serveru jsou vypnuté (knowledge.enabled v config.yml).'
  empty: '<prefix> <yellow>Použití: <white>/aifriend teach <fakt></white>'
  too-long: '<prefix> <red>Fakt může mít nejvýše <max> znaků. Rozdělte ho na více.'
  full: '<prefix> <red>Bot už zná <max> naučených faktů. Smažte některé příkazem /aifriend knowledge forget <číslo>.'
  failed: '<prefix> <red>Soubor se znalostmi se nepodařilo zapsat. Podívejte se do konzole.'
  taught: '<prefix> <green>Naučeno: <white><text>'
  status:
    - '<prefix> <gold>Znalosti o serveru'
    - '<gray>  Záznamy ze souborů (knowledge.txt + naučené): <white><file>'
    - '<gray>  Vestavěné znalosti o sobě: <white><self>'
    - '<gray>  Naučené fakty: <white><taught></white> · vypíšete je příkazem <white>/aifriend knowledge list'
  list-header: '<prefix> <gold>Naučené fakty (<count>)'
  list-line: '<gray>  <number>. <white><text>'
  list-empty: '<prefix> <gray>Zatím nic nebylo naučeno příkazem /aifriend teach.'
  forgot: '<prefix> <green>Zapomenuto: <white><text>'
  forget-missing: '<prefix> <yellow>Naučený fakt s tímto číslem neexistuje.'
  status-learned: '<gray>  Naučeno z chatu: <white><approved></white> schváleno, <yellow><pending></yellow> čeká na schválení, <white><candidates></white> kandidátů, <white><rejected></white> zamítnuto · <click:run_command:''/aifriend learned''><aqua>/aifriend learned</aqua></click>'
  status-learning-off: '<gray>  Učení z chatu: vypnuto (knowledge.learning.enabled)'

# Fakty o serveru, které se bot naučil z chatu (knowledge.learning); admini je schvalují příkazem /aifriend learned.
learned:
  disabled: '<prefix> <yellow>Učení z chatu je vypnuté (knowledge.enabled a knowledge.learning.enabled v config.yml).'
  new: '<prefix> <gold>Bot se něco naučil (#<id>, slyšel <mentions>×): <white><text></white> <click:run_command:''/aifriend learned''><aqua>[zkontrolovat]</aqua></click>'
  pending-on-join: '<prefix> <gold><count></gold> <yellow>naučených faktů z chatu čeká na vaše schválení. <click:run_command:''/aifriend learned''><aqua>[otevřít]</aqua></click>'
  missing: '<prefix> <yellow>Naučený fakt s tímto číslem neexistuje.'
  edit-invalid: '<prefix> <red>Fakt musí mít <min> až <max> znaků.'
  done:
    approve: '<prefix> <green>Schváleno #<id>, bot to teď používá: <white><text>'
    disable: '<prefix> <gray>Vypnuto #<id> (nepoužívá se, znovu se nenavrhne): <white><text>'
    reject: '<prefix> <red>Zamítnuto #<id>, už se to nikdy nenaučí: <white><text>'
    delete: '<prefix> <gray>Smazáno #<id> (může se naučit znovu): <white><text>'
    edit: '<prefix> <green>Upraveno #<id>: <white><text>'
  status:
    pending: 'Čeká na schválení'
    approved: 'Schválené'
    disabled: 'Vypnuté'
    rejected: 'Zamítnuté'
    candidate: 'Kandidáti'
  list-header: '<prefix> <gold><status> (<count>)'
  list-line: '<gray>  #<id> <white><text></white> <dark_gray>(<mentions>×, <players>)</dark_gray> <actions>'
  list-more: '<gray>  ... a dalších <count> (viz GUI: /aifriend learned)'
  list-empty: '<prefix> <gray>Nic tu není: <status>.'
  list-tabs: '<gray>  Další seznamy: /aifriend learned list pending|approved|disabled|rejected|candidate'
  button:
    approve: '<green>[✔]'
    disable: '<gray>[⏸]'
    reject: '<red>[✘]'
    delete: '<dark_red>[🗑]'
  button-hover:
    approve: '<green>Schválit: bot fakt použije v odpovědích'
    disable: '<gray>Vypnout: nepoužívá se a znovu se nenavrhne (schválit jde později)'
    reject: '<red>Zamítnout: už se nikdy nenaučí (ani nic podobného)'
    delete: '<dark_red>Úplně smazat: později se může naučit znovu'
  gui:
    title: '<dark_gray>Naučeno: <status> (<page>/<pages>)'
    fact-name: '<yellow>#<id>'
    text-line: '<white><text>'
    mentions: '<gray>Slyšeno <aqua><mentions>×</aqua> · od <white><players>'
    seen: '<gray>Poprvé <white><first></white> · naposledy <white><last>'
    decided: '<gray>Rozhodl <white><by></white> <white><at>'
    hint-approve: '<green>Levé kliknutí: schválit'
    hint-reject: '<red>Pravé kliknutí: zamítnout (už nikdy)'
    hint-disable: '<gray>Shift + levé: vypnout'
    hint-delete: '<dark_red>Shift + pravé: smazat'
    hint-edit: '<dark_gray>Úprava textu: /aifriend learned edit <id> <text>'
    tab: '<gold><status> <gray>(<count>)'
    tab-lore:
      pending: ['<gray>Fakty slyšené dost často,', '<gray>čekají na vaše rozhodnutí.']
      approved: ['<gray>Bot je používá v odpovědích.']
      disabled: ['<gray>Uložené, ale nepoužívají se', '<gray>a znovu se nenavrhnou.']
      rejected: ['<gray>Už se nikdy nenaučí,', '<gray>ani nic podobného.']
      candidate: ['<gray>Slyšeno méněkrát než min-mentions.', '<gray>Rozhodnout můžete už teď.']
    prev: '<yellow>« Předchozí stránka'
    next: '<yellow>Další stránka »'
    empty: '<gray>Nic tu není'
    help-name: '<gold>Jak to funguje'
    help:
      - '<gray>Bot si z chatu bere obecné fakty'
      - '<gray>o serveru. V odpovědích používá'
      - '<gray>jen ty schválené.'
      - ''
      - '<green>Levé</green> <gray>schválit · <red>Pravé</red> <gray>zamítnout'
      - '<gray>Shift+levé vypnout · <dark_red>Shift+pravé</dark_red> <gray>smazat'

# Přátelská soukromá upozornění dohledu nad chatem (hráči se jinak nic nestane).
supervision:
  caps: '<prefix> <gray>Pssst, tvoje zpráva je dost HLASITÁ. Zkus trochu zvolnit s caps lockem :)'
  spam: '<prefix> <gray>Pomalu, píšeš velmi rychle nebo se opakuješ. Nech chat chvilku vydechnout :)'
  language: '<prefix> <gray>Držme chat přátelský, prosím. Všichni tu jsou lidé (nebo boti) s city :)'

update:
  available: '<prefix> <yellow>Je dostupná nová verze: <white><version></white> <click:open_url:''<url>''><aqua>[stáhnout]</aqua></click>'
