<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Illustration of AI Friend chat">
  <title>AI Friend chat (illustration)</title>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb7e6"/><stop offset="1" stop-color="#4f8a3c"/></linearGradient></defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect x="0" y="470" width="1280" height="250" fill="#5b8c3a"/>
  <rect x="0" y="470" width="1280" height="14" fill="#3f6b28"/>
  <g font-family="Menlo, Consolas, monospace" font-size="26">
    <rect x="20" y="360" width="1000" height="300" fill="#000" opacity=".5"/>
    <text x="36" y="402" fill="#fff">&lt;Steve&gt; anyone up for a trip to the Nether?</text>
    <text x="36" y="444" fill="#fff">&lt;Alex&gt; yes, I just need a pickaxe first</text>
    <text x="36" y="486" fill="#fff">&lt;Steve&gt; I have a spare one, meet at spawn</text>
    <text x="36" y="528" fill="#fff">&lt;Alex&gt; thanks!</text>
    <text x="36" y="570" fill="#7cffb2">AI Friend: Sounds like a plan! Bring a water</text>
    <text x="36" y="606" fill="#7cffb2">bucket and some food, just in case.</text>
    <rect x="20" y="624" width="1000" height="36" fill="#000" opacity=".4"/>
    <text x="36" y="651" fill="#aaa">_</text>
  </g>
  <rect x="860" y="660" width="400" height="40" fill="#000" opacity=".6"/>
  <text x="872" y="687" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff">Illustration, not a game screenshot</text>
</svg>
