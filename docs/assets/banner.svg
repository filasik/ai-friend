<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="AI Friend banner">
  <title>AI Friend</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a5a"/><stop offset="1" stop-color="#0f1a3a"/></linearGradient>
  <linearGradient id="ib" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#3b5bdb"/></linearGradient></defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="60" y="46" width="208" height="208" rx="40" fill="url(#ib)"/>
  <g transform="translate(60 46) scale(.8125)"><g shape-rendering="crispEdges">
    <rect x="48" y="32" width="160" height="144" fill="#16163a"/><rect x="32" y="48" width="192" height="112" fill="#16163a"/><rect x="64" y="176" width="16" height="32" fill="#16163a"/><rect x="80" y="192" width="16" height="16" fill="#16163a"/><rect x="96" y="176" width="16" height="16" fill="#16163a"/>
    <rect x="64" y="48" width="128" height="112" fill="#fdfbf3"/><rect x="48" y="64" width="160" height="80" fill="#fdfbf3"/><rect x="80" y="160" width="16" height="32" fill="#fdfbf3"/>
    <rect x="96" y="64" width="16" height="32" fill="#16163a"/><rect x="144" y="64" width="16" height="32" fill="#16163a"/><rect x="80" y="96" width="16" height="16" fill="#16163a"/><rect x="160" y="96" width="16" height="16" fill="#16163a"/><rect x="96" y="112" width="64" height="16" fill="#16163a"/>
    <rect x="64" y="80" width="16" height="16" fill="#ffb3c1"/><rect x="176" y="80" width="16" height="16" fill="#ffb3c1"/>
  </g></g>
  <text x="310" y="145" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff">AI Friend</text>
  <text x="314" y="196" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#b9c6ff">A chat companion for Paper</text>
  <g>
    <rect x="780" y="70" width="360" height="42" fill="#000" opacity=".55"/>
    <rect x="780" y="116" width="360" height="42" fill="#000" opacity=".55"/>
    <rect x="780" y="162" width="360" height="68" fill="#000" opacity=".55"/>
    <g font-family="Menlo, Consolas, monospace" font-size="15">
      <text x="792" y="97" fill="#e8e8e8">&lt;Steve&gt; anyone up for the Nether?</text>
      <text x="792" y="143" fill="#e8e8e8">&lt;Alex&gt; yes, pickaxe first!</text>
      <text x="792" y="189" fill="#7cffb2">AI Friend: Sounds fun! Bring</text>
      <text x="792" y="212" fill="#7cffb2">a water bucket and some food.</text>
    </g>
  </g>
</svg>
